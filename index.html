<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Entidades: Confronto de Lendas - V5.3 Bravely Final</title>
    <style>
        :root { --tile-size: 55px; --gap: 4px; --step: 59px; }
        
        @media (max-width: 600px) {
            :root { --tile-size: 42px; --gap: 2px; --step: 44px; }
            body { padding: 5px; }
            .game-area { flex-direction: column; align-items: center; gap: 10px; }
            .panel { width: 95% !important; max-width: 350px; }
            .setup-row { flex-direction: column; width: 95%; }
            .skills-guide { flex-wrap: wrap; gap: 5px; font-size: 9px; }
            button { padding: 12px !important; font-size: 14px !important; }
            .dmg-float, .heal-float { font-size: 22px !important; }
        }

        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: #eee; padding: 10px; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; touch-action: manipulation; }
        .version-tag { position: absolute; top: 5px; right: 10px; font-size: 10px; color: #666; }
        .skills-guide { background: #2c3e50; padding: 10px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #444; width: 95%; max-width: 1000px; display: flex; justify-content: space-around; font-size: 11px; text-align: center; }
        .skill-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
        .setup-row { background: #2c3e50; padding: 10px; border-radius: 10px; margin-bottom: 10px; display: flex; gap: 15px; align-items: center; border: 1px solid #444; width: 95%; max-width: 1000px; flex-wrap: wrap; }
        .config-table { font-size: 10px; }
        .config-table input { width: 35px; background: #1a1a1a; color: #0f0; border: 1px solid #555; text-align: center; }
        .game-area { display: flex; gap: 15px; align-items: flex-start; }
        
        .board-wrapper { position: relative; width: calc((var(--tile-size) * 8) + (var(--gap) * 7)); height: calc((var(--tile-size) * 8) + (var(--gap) * 7)); background: #222; padding: 8px; border-radius: 12px; border: 4px solid #333; overflow: visible; z-index: 1; margin-top: 50px; }
        .grid { display: grid; grid-template-columns: repeat(8, var(--tile-size)); gap: var(--gap); position: relative; z-index: 2; }
        .tile { width: var(--tile-size); height: var(--tile-size); cursor: pointer; border-radius: 4px; transition: background 0.2s; position: relative; display: flex; align-items: center; justify-content: center; }
        .tile.selected { border: 2px solid white; transform: scale(0.85); box-shadow: inset 0 0 10px #fff; z-index: 5; }
        .tile.bravely-ready { border: 3px solid gold !important; animation: goldPulse 0.5s infinite alternate; z-index: 6; }
        .tile.skill-mode { animation: pulseSkill 1s infinite; border: 2px solid gold; z-index: 20; }
        
        @keyframes goldPulse { from { box-shadow: 0 0 5px gold; } to { box-shadow: 0 0 20px gold; } }

        .amulet-img { width: 80%; height: 80%; object-fit: contain; pointer-events: none; position: absolute; filter: drop-shadow(0 0 3px black); }

        .bg-FOGO { background: linear-gradient(135deg, #e74c3c, #c0392b); } 
        .bg-AGUA { background: linear-gradient(135deg, #3498db, #2980b9); }
        .bg-TERRA { background: linear-gradient(135deg, #27ae60, #1e8449); } 
        .bg-AR { background: linear-gradient(135deg, #f1c40f, #f39c12); }
        
        .token { position: absolute; width: var(--tile-size); height: var(--tile-size); z-index: 10; transition: all 0.3s ease-in-out; pointer-events: none; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .token img { width: 120%; height: 120%; object-fit: contain; animation: breathe 2s infinite ease-in-out; }
        
        .p-hue-0 { filter: none; }
        .p-hue-1 { filter: hue-rotate(90deg) brightness(1.2); }
        .p-hue-2 { filter: hue-rotate(180deg) saturate(1.5); }
        .p-hue-3 { filter: hue-rotate(270deg) contrast(1.2); }

        .hp-container { position: absolute; top: -12px; width: 80%; height: 6px; background: rgba(0,0,0,0.5); border: 1px solid #000; border-radius: 3px; overflow: hidden; }
        .hp-bar { height: 100%; background: #2ecc71; transition: width 0.3s ease, background 0.3s ease; }

        @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1) translateY(-4px); } }
        
        .tsunami-fx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(0,120,255,0.9) 40%, rgba(0,0,50,0.5) 100%); z-index: 180; pointer-events: none; animation: tsunamiBlast 1.2s forwards; border-radius: 50%; }
        @keyframes tsunamiBlast { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(3); opacity: 0; } }
        
        .water-jet-fx { position: absolute; z-index: 195; pointer-events: none; background: linear-gradient(90deg, transparent, #fff, #3498db, #fff, transparent); box-shadow: 0 0 25px #3498db; animation: jetFlash 0.6s ease-out forwards; opacity: 0; }
        @keyframes jetFlash { 0% { opacity: 0; transform: scaleY(0.1); } 50% { opacity: 1; transform: scaleY(1); } 100% { opacity: 0; transform: scaleY(0.5); } }
        
        .fire-column { position: absolute; top: 0; width: var(--tile-size); height: 100%; background: linear-gradient(to top, rgba(255, 0, 0, 0.9) 0%, rgba(255, 69, 0, 1) 50%, rgba(255, 255, 0, 0.7) 100%); z-index: 200; pointer-events: none; animation: fireFlashLento 1.2s ease-in-out forwards; filter: drop-shadow(0 0 15px #ff4500); }
        .fire-row { position: absolute; left: 0; height: var(--tile-size); width: 100%; background: linear-gradient(to right, rgba(255, 0, 0, 0.9) 0%, rgba(255, 69, 0, 1) 50%, rgba(255, 255, 0, 0.7) 100%); z-index: 200; pointer-events: none; animation: fireFlashLento 1.2s ease-in-out forwards; filter: drop-shadow(0 0 15px #ff4500); }
        @keyframes fireFlashLento { 0% { opacity: 0; transform: scale(0); } 30% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0; transform: scale(1); } }
        
        .bite-fx { position: absolute; z-index: 210; pointer-events: none; transform: scale(0); filter: drop-shadow(0 0 15px #ff0000); }
        @keyframes biteAnim { 0% { transform: scale(0.2); opacity: 0; } 30% { transform: scale(3.5); opacity: 1; } 100% { transform: scale(2.5); opacity: 0; } }
        
        /* ROCHA - VELOCIDADE AUMENTADA */
        .rock-projectile { position: absolute; z-index: 200; pointer-events: none; filter: drop-shadow(4px 4px 5px #000); transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1); }
        
        .flare-fx { position: absolute; width: var(--tile-size); height: var(--tile-size); background: radial-gradient(circle, #ff0, #f00, transparent); z-index: 180; pointer-events: none; animation: flareUp 0.6s forwards; border-radius: 50%; }
        @keyframes flareUp { 0% { transform: scale(0); opacity: 1; } 100% { transform: scale(2); opacity: 0; } }
        .vortex-fx { position: absolute; z-index: 200; pointer-events: none; animation: spin 0.3s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .dmg-float, .heal-float { position: absolute; font-size: 28px; font-weight: bold; pointer-events: none; z-index: 155; text-shadow: 2px 2px 0 #000; animation: floatUpGrow 1.2s ease-out forwards; }
        .dmg-float { color: #ff3333; } .heal-float { color: #33ff33; }
        @keyframes floatUpGrow { 
            0% { opacity: 0; transform: translateY(0) scale(0.5); } 
            30% { opacity: 1; transform: translateY(-40px) scale(1.3); }
            100% { opacity: 0; transform: translateY(-100px) scale(1.6); } 
        }

        .panel { background: #2c3e50; padding: 12px; border-radius: 10px; width: 210px; border: 1px solid #444; }
        .turn-box { padding: 6px; text-align: center; font-weight: bold; border-radius: 4px; margin-bottom: 8px; opacity: 0.2; font-size: 11px; color: white; }
        .active-turn { opacity: 1; border: 2px solid gold; box-shadow: 0 0 10px rgba(255,215,0,0.4); }

        .config-tabs { display: flex; gap: 3px; margin-bottom: 10px; justify-content: center; }
        .config-tabs button { flex: 1; padding: 5px; font-size: 10px; background: #222; color: #fff; border: 1px solid #444; cursor: pointer; }
        .config-tabs button.active-tab { background: #e67e22; border-color: gold; }

        .player-input { width: 100%; padding: 5px; box-sizing: border-box; background: #1a1a1a; color: #fff; border: 1px solid #555; border-radius: 4px; margin-bottom: 5px; }
        .elem-display { font-size: 10px; font-weight: bold; padding: 3px; border-radius: 3px; text-align: center; margin-bottom: 8px; text-transform: uppercase; color: #fff; }
        button { width: 100%; padding: 10px; cursor: pointer; border-radius: 4px; font-weight: bold; border: none; transition: 0.2s; }
        .btn-main { background: #d35400; color: white; margin-top: 5px; }
        .btn-skill { background: #2980b9; color: white; margin-top: 5px; font-size: 11px; padding: 8px; }
        .btn-skill:disabled { background: #444 !important; color: #777; }
        .log { width: 100%; height: 120px; background: #000; color: #0f0; font-family: monospace; font-size: 10px; padding: 5px; overflow-y: auto; margin-top: 8px; border-radius: 4px; border: 1px solid #333; line-height: 1.2; }
        .projectile { position: absolute; width: 30px; height: 30px; z-index: 50; pointer-events: none; transition: all 0.3s linear; }
        .sword-fx { position: absolute; width: 50px; height: 50px; z-index: 60; pointer-events: none; animation: swordSlash 0.4s ease-out forwards; }
        @keyframes swordSlash { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 100% { transform: scale(1.2) rotate(90deg); opacity: 0; } }

        #gameOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; animation: fadeIn 0.5s forwards; }
        #gameOverlay h1 { font-size: 55px; margin: 0; text-shadow: 0 0 20px #000; letter-spacing: 5px; text-align: center; padding: 20px; }
        .win-text { color: #f1c40f; text-shadow: 0 0 30px gold !important; }
        .lose-text { color: #c0392b; text-shadow: 0 0 30px red !important; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* POPUP BRAVELY */
        #bravelyPop { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0); color: gold; font-size: 60px; font-weight: 900; text-shadow: 0 0 20px #000, 0 0 40px orange; z-index: 2000; pointer-events: none; white-space: nowrap; font-style: italic; }
        .pop-anim { animation: popBravely 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popBravely { 0% { transform: translate(-50%, -50%) scale(0); opacity: 0; } 30% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } 70% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -150%) scale(0.8); opacity: 0; } }
    </style>
</head>
<body onclick="unlockAudio()">
    <div class="version-tag">VERSÃO 5.3 (BRAVELY CHAIN FINAL)</div>
    <div id="gameOverlay">
        <h1 id="overlayTitle">VITORIA</h1>
        <button onclick="initGame()" style="width: 200px; margin-top: 20px; background: #27ae60; color: white; font-size: 20px;">JOGAR NOVAMENTE</button>
    </div>
    <div id="bravelyPop">BRAVELY CHAIN!</div>

    <div class="skills-guide">
        <div class="skill-item"><b style="color:#f1c40f">LINHA (4)</b><small>+2 ATK / +1 HP</small></div>
        <div class="skill-item"><b style="color:#2ecc71">L (4)</b><small>CURA +2 HP</small></div>
        <div class="skill-item"><b style="color:#3498db">QUAD (4)</b><small>RESET ULT</small></div>
        <div class="skill-item"><b style="color:#e74c3c">ZIGZAG (4)</b><small>+3 ATK</small></div>
    </div>

    <div class="setup-row">
        <table class="config-table">
            <tr><td>Tupã: HP <input type="number" id="hp_Tupa" value="15"> ATK <input type="number" id="atk_Tupa" value="2"></td></tr>
            <tr><td>Sumé: HP <input type="number" id="hp_Sume" value="8"> ATK <input type="number" id="atk_Sume" value="2"></td></tr>
            <tr><td>Caipora: HP <input type="number" id="hp_Caipora" value="10"> ATK <input type="number" id="atk_Caipora" value="2"></td></tr>
            <tr><td>Muiraquitã: <input type="number" id="amulet_chance" value="1">% | Bravely: <input type="number" id="bravely_tiles" value="8" style="width:30px"> tiles</td></tr>
            <tr style="border-top: 1px solid #555"><td>BOSS: HP <input type="number" id="hp_BOSS_cfg" value="60"> ATK <input type="number" id="atk_BOSS_cfg" value="4"></td></tr>
        </table>
        <div>MODO: <select id="gameMode" onchange="initGame()"><option value="BOSS">BOSS (CO-OP)</option><option value="PVP">PVP (1vs1)</option></select></div>
        <div>BOSS: <select id="bossSelect" onchange="initGame()"><option value="BOITATA">Boitatá</option><option value="MAPINGUARI">Mapinguari</option><option value="SACI">Saci</option><option value="IARA">Iara</option></select></div>
        <div>PLAYERS: <select id="playerCount" onchange="initGame()"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select></div>
        <button onclick="initGame()" style="background:#16a085; color:white; width:auto;">REINICIAR</button>
    </div>

    <div class="game-area">
        <div class="panel">
            <div id="turnP_Active" class="turn-box" style="background:#8e44ad">TURNO ATUAL</div>
            <div class="config-tabs" id="tabBar"></div>
            <input type="text" id="pName" class="player-input" oninput="saveAndRefresh()">
            <div id="pElem" class="elem-display"></div>
            <select id="pClass" class="player-input" onchange="resetPlayerHP()"></select>
            <div id="pStatsDisplay" style="text-align:center; font-size:11px; margin-bottom:5px;"></div>
            <button id="btnSkill" class="btn-skill" onclick="activateSkill()">ULTIMATE (1x)</button>
            <button id="btnPlay" class="btn-main" onclick="executeAction()">JOGAR TURNO</button>
        </div>

        <div class="board-wrapper" id="board">
            <div class="grid" id="grid"></div>
        </div>

        <div class="panel">
            <div id="turnBoss" class="turn-box" style="background:#c0392b">BOSS</div>
            <div id="bossStatsDisplay" style="text-align:center; font-weight:bold; color:red;"></div>
            <div class="log" id="log"></div>
        </div>
    </div>

<script>
    const COLORS = ['FOGO', 'AGUA', 'TERRA', 'AR'];
    const SPRITES = {
        Tupa: "https://i.ibb.co/6c328D1m/tupa.png", Sume: "https://i.ibb.co/G4RdNKm9/sume.png", Caipora: "https://i.ibb.co/C5RNg4Vq/caipora.png",
        BOITATA: "https://i.ibb.co/DDjQ65GV/boitata.png", MAPINGUARI: "https://i.ibb.co/tMLK2pcX/mapinguari.png", SACI: "https://i.ibb.co/0psrrg1S/saci-token.png", IARA: "https://i.ibb.co/LDsxbV3X/iara-token.png",
        Muiraquita: "https://i.ibb.co/JjYQszc0/muiraquita.png", VortexFX: "https://cdn-icons-png.flaticon.com/512/1344/1344933.png", SwordFX: "https://cdn-icons-png.flaticon.com/512/6720/6720973.png", ArrowFX: "https://cdn-icons-png.flaticon.com/512/95/95460.png", MagicFX: "https://cdn-icons-png.flaticon.com/512/1310/1310630.png", BiteFX: "https://cdn-icons-png.flaticon.com/512/3504/3504404.png", RockFX: "https://cdn-icons-png.flaticon.com/512/3223/3223193.png"
    };

    let audioUnlocked = false;
    const sfx = {
        skill1: new Audio("dramatic-synth-echo-43970.mp3"), atkg: new Audio("atkg.mp3"), atkm: new Audio("atkm.mp3"), atka: new Audio("atka.mp3"),
        click: new Audio("click.mp3"), bgm: new Audio("fundoboss.mp3"), minoa1: new Audio("minoa1.mp3"), minoa2: new Audio("minoa2.mp3"),
        saci: new Audio("saci.mp3"), saci1: new Audio("saci1.mp3"), iara1: new Audio("iara1.mp3"), iara2: new Audio("iara2.mp3"),
        win: new Audio("win.mp3"), gameover: new Audio("gameover.mp3")
    };
    sfx.bgm.loop = true; sfx.bgm.volume = 0.3;

    function unlockAudio() { if (!audioUnlocked) { Object.values(sfx).forEach(a => { a.play().then(() => { a.pause(); if(a === sfx.bgm) { a.currentTime = 0; a.play(); } }).catch(()=>{}); }); audioUnlocked = true; addLog("Áudio ativado."); } }
    function playSfx(name) { if (!audioUnlocked || !sfx[name]) return; const sound = sfx[name].cloneNode(); sound.volume = 0.6; sound.play(); }

    let CLASS_DB = {}, grid = [], path = [], players = [], amulets = []; 
    let boss = { x: 4, y: 0, hp: 0, maxHp: 0, type: 'BOITATA', dead: false };
    let currentPlayerIdx = 0, editingIdx = 0, gameActive = true, mode = "BOSS", skillActive = false;

    function addLog(msg) { const log = document.getElementById('log'); log.innerHTML += `<div>> ${msg}</div>`; log.scrollTop = log.scrollHeight; }

    function updateClassBase() {
        ['Tupa', 'Sume', 'Caipora'].forEach(cls => {
            CLASS_DB[cls] = { hp: parseInt(document.getElementById(`hp_${cls}`).value), atk: parseInt(document.getElementById(`atk_${cls}`).value), min: (cls === 'Sume' ? 4 : (cls === 'Caipora' ? 3 : 0)) };
        });
    }

    function switchConfig(idx) {
        editingIdx = idx; const p = players[idx];
        document.getElementById('pName').value = p.name; document.getElementById('pClass').value = p.class;
        document.querySelectorAll('.config-tabs button').forEach(b => b.classList.remove('active-tab'));
        if(document.getElementById(`tab${idx}`)) document.getElementById(`tab${idx}`).classList.add('active-tab');
        saveAndRefresh();
    }

    function saveAndRefresh() {
        const p = players[editingIdx]; if(!p) return;
        p.name = document.getElementById('pName').value.toUpperCase();
        let s = 0; for(let i=0; i<p.name.length; i++) s += p.name.charCodeAt(i);
        p.element = COLORS[s % 4];
        const ed = document.getElementById('pElem'); ed.innerText = p.element; ed.className = `elem-display bg-${p.element}`;
        document.getElementById('pStatsDisplay').innerHTML = `HP: <b>${p.hp}</b> / ${p.maxHp} | ATK: <b>${CLASS_DB[p.class].atk + p.bonusAtk}</b>`;
        const img = document.getElementById(`imgP${p.id}`); if(img) img.src = SPRITES[p.class];
        const isMyTurn = (editingIdx === currentPlayerIdx);
        document.getElementById('btnPlay').disabled = !isMyTurn;
        document.getElementById('btnSkill').disabled = !isMyTurn || players[currentPlayerIdx].skillUsed;
    }

    function resetPlayerHP() { const p = players[editingIdx]; p.class = document.getElementById('pClass').value; p.hp = CLASS_DB[p.class].hp; p.maxHp = p.hp; saveAndRefresh(); updateVisuals(); }

    function createTile(idx) {
        const c = COLORS[Math.floor(Math.random()*4)]; grid[idx] = c;
        const chance = parseFloat(document.getElementById('amulet_chance').value) || 1;
        amulets[idx] = (Math.random() * 100 < chance);
        const tile = document.createElement('div'); tile.className = `tile bg-${c}`; tile.onclick = () => handleSelect(idx);
        if(amulets[idx]) { const img = document.createElement('img'); img.src = SPRITES.Muiraquita; img.className = 'amulet-img'; tile.appendChild(img); }
        return tile;
    }

    function initGame() {
        gameActive = true; mode = document.getElementById('gameMode').value;
        document.getElementById('gameOverlay').style.display = 'none';
        if(audioUnlocked) sfx.bgm.play();
        const count = mode === "PVP" ? 2 : parseInt(document.getElementById('playerCount').value);
        updateClassBase(); grid = []; path = []; players = []; amulets = [];
        const gridEl = document.getElementById('grid'); gridEl.innerHTML = '';
        for(let i=0; i<64; i++) gridEl.appendChild(createTile(i));
        const tabBar = document.getElementById('tabBar'); tabBar.innerHTML = '';
        for(let i=0; i<count; i++) {
            const btn = document.createElement('button'); btn.innerText = `P${i+1}`;
            btn.onclick = () => switchConfig(i); btn.id = `tab${i}`; tabBar.appendChild(btn);
        }
        document.querySelectorAll('.token').forEach(t => t.remove());
        const board = document.getElementById('board');
        for(let i=0; i<count; i++) {
            const initialHP = CLASS_DB['Tupa'].hp;
            players.push({ id: i, x: 2 + i, y: 7, hp: initialHP, maxHp: initialHP, class: 'Tupa', element: 'FOGO', name: `P${i+1}`, skillUsed: false, dead: false, bonusAtk: 0 });
            const token = document.createElement('div'); token.id = `tokenP${i}`; token.className = `token p-hue-${i}`;
            token.innerHTML = `<div class="hp-container"><div id="hpBarP${i}" class=\"hp-bar\"></div></div><img id="imgP${i}" src="${SPRITES.Tupa}">`;
            board.appendChild(token);
        }
        if(mode === "BOSS") {
            boss.type = document.getElementById('bossSelect').value; boss.maxHp = parseInt(document.getElementById('hp_BOSS_cfg').value);
            boss.hp = boss.maxHp; boss.x = 4; boss.y = 0; boss.dead = false;
            document.getElementById('turnBoss').innerText = `${boss.type} BOSS`;
            const bToken = document.createElement('div'); bToken.id = `tokenBoss`; bToken.className = `token`;
            bToken.innerHTML = `<div class="hp-container"><div id="hpBarBoss" class="hp-bar"></div></div><img src="${SPRITES[boss.type]}">`;
            board.appendChild(bToken);
        } else { players[1].y = 0; players[1].x = 4; players[1].hp = CLASS_DB[players[1].class].hp; players[1].maxHp = players[1].hp; }
        document.getElementById('pClass').innerHTML = '<option value="Tupa">Tupã</option><option value="Sume">Sumé</option><option value="Caipora">Caipora</option>';
        currentPlayerIdx = 0; switchConfig(0); updateVisuals();
    }

    function isOccupied(nx, ny, excludeId) {
        if (mode === "BOSS" && boss.x === nx && boss.y === ny && !boss.dead) return true;
        return players.some(p => !p.dead && p.id !== excludeId && p.x === nx && p.y === ny);
    }

    function checkAmulet(p, x, y) {
        const idx = y * 8 + x;
        if(amulets[idx]) {
            amulets[idx] = false; p.bonusAtk += 1;
            const tile = document.querySelectorAll('.tile')[idx]; if(tile) tile.innerHTML = '';
            addLog(`${p.name} coletou o Muiraquitã! +1 ATK Permanente.`); saveAndRefresh();
        }
    }

    function handleSelect(idx) {
        if(!gameActive) return;
        const p = players[currentPlayerIdx];
        if (skillActive) {
            grid[idx] = p.element; document.querySelectorAll('.tile')[idx].className = `tile bg-${p.element}`;
            p.skillUsed = true; skillActive = false; document.querySelectorAll('.tile').forEach(t => t.classList.remove('skill-mode'));
            addLog(`${p.name} ativou Ultimate!`); saveAndRefresh(); return;
        }
        const x = idx % 8, y = Math.floor(idx / 8);
        const occupied = isOccupied(x, y, p.id);
        if(occupied || (x === p.x && y === p.y)) return;
        if(path.length === 0) { if((Math.abs(x-p.x)+Math.abs(y-p.y)) === 1) { path.push(idx); playSfx('click'); } }
        else {
            const lastIdx = path[path.length-1];
            if(idx === lastIdx) { path.pop(); playSfx('click'); }
            else if(!path.includes(idx) && grid[idx] === grid[lastIdx] && (Math.abs(x-lastIdx%8)+Math.abs(y-Math.floor(lastIdx/8))) === 1) { path.push(idx); playSfx('click'); }
        }
        renderPath();
    }

    function renderPath() {
        const threshold = parseInt(document.getElementById('bravely_tiles').value) || 8;
        const isBravely = path.length >= threshold;
        document.querySelectorAll('.tile').forEach((t, i) => {
            t.classList.toggle('selected', path.includes(i));
            t.classList.toggle('bravely-ready', isBravely && path.includes(i));
        });
    }

    function detectShape(pIdxs) {
        if(pIdxs.length !== 4) return null;
        const coords = pIdxs.map(i => ({x: i%8, y: Math.floor(i/8)}));
        const xs = coords.map(c => c.x), ys = coords.map(c => c.y);
        const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
        const w = maxX - minX, h = maxY - minY;
        if (w === 0 || h === 0) return "LINHA";
        if (w === 1 && h === 1) return "QUADRADO";
        let vectors = [];
        for(let i=1; i<coords.length; i++) vectors.push({ dx: coords[i].x - coords[i-1].x, dy: coords[i].y - coords[i-1].y });
        let turns = 0;
        for(let i=1; i<vectors.length; i++) if (vectors[i].dx !== vectors[i-1].dx || vectors[i].dy !== vectors[i-1].dy) turns++;
        if ((vectors[0].dx === vectors[1].dx && vectors[0].dy === vectors[1].dy || vectors[1].dx === vectors[2].dx && vectors[1].dy === vectors[2].dy) && turns === 1) return "L";
        if (turns === 2 && vectors[0].dx === vectors[2].dx && vectors[0].dy === vectors[2].dy) return "ZIGZAG";
        return null;
    }

    async function triggerBravelyPop() {
        const pop = document.getElementById('bravelyPop');
        pop.classList.remove('pop-anim'); void pop.offsetWidth;
        pop.classList.add('pop-anim');
    }

    async function executeAction() {
        if(!gameActive || path.length === 0) return;
        const active = players[currentPlayerIdx];
        const target = (mode === "BOSS") ? boss : players.find(p => p.id !== active.id && !p.dead);
        const info = CLASS_DB[active.class], usedPath = [...path];
        const threshold = parseInt(document.getElementById('bravely_tiles').value) || 8;
        const isBravely = usedPath.length >= threshold;

        let skillAtkBonus = 0;
        const shape = detectShape(usedPath);
        if(shape) {
            addLog(`Skill ${shape} detectada!`);
            if(shape === "LINHA") { skillAtkBonus = 2; active.hp = Math.min(active.maxHp, active.hp + 1); showHealEffect(active.x, active.y, 1); }
            if(shape === "L") { active.hp = Math.min(active.maxHp, active.hp + 2); showHealEffect(active.x, active.y, 2); }
            if(shape === "ZIGZAG") skillAtkBonus = 3;
            if(shape === "QUADRADO") { active.skillUsed = false; addLog("Ultimate Recarregada!"); }
        }

        let totalAtk = info.atk + active.bonusAtk + (usedPath.length > 0 && grid[usedPath[0]] === active.element ? 1 : 0) + skillAtkBonus;

        if(active.class === "Tupa") {
            const dealGueDmg = () => { if(!target.dead && (Math.abs(active.x-target.x)+Math.abs(active.y-target.y)) <= 1) { playSfx('atkg'); applyDmg(target, totalAtk); spawnSwordEffect(target.x, target.y); } };
            dealGueDmg();
            for(const idx of usedPath) { active.x = idx%8; active.y = Math.floor(idx/8); checkAmulet(active, active.x, active.y); updateVisuals(); await new Promise(r => setTimeout(r, 120)); dealGueDmg(); }
        } else {
            for(const idx of usedPath) { active.x = idx%8; active.y = Math.floor(idx/8); checkAmulet(active, active.x, active.y); updateVisuals(); await new Promise(r => setTimeout(r, 100)); }
            if(usedPath.length >= info.min && !target.dead) {
                let extra = usedPath.length - info.min; playSfx(active.class === 'Sume' ? 'atkm' : 'atka'); await spawnProjectile(active, target, active.class === "Caipora" ? 'Arrow' : 'Magic');
                applyDmg(target, totalAtk + (active.class === "Sume" ? extra : Math.floor(extra/2)));
            }
        }

        // --- BRAVELY CHAIN LOGIC ---
        if(isBravely) {
            await triggerBravelyPop();
            let affectedIndices = [];
            if(active.class === "Tupa") {
                triggerElementalFX(active.element, active.x, 'COL', active.x, active.y);
                for(let row=0; row<8; row++) affectedIndices.push(row * 8 + active.x);
                if(!target.dead && target.x === active.x) applyDmg(target, totalAtk);
            } 
            else if(active.class === "Sume") {
                triggerElementalFX(active.element, active.y, 'ROW', active.x, active.y);
                for(let col=0; col<8; col++) affectedIndices.push(active.y * 8 + col);
                if(!target.dead && target.y === active.y) applyDmg(target, totalAtk);
                players.forEach(p => { if(!p.dead && p.y === active.y) { p.hp = Math.min(p.maxHp, p.hp+2); showHealEffect(p.x, p.y, 2); } });
            }
            else if(active.class === "Caipora") {
                addLog("Chuva de Flechas!");
                playSfx('atka');
                for(let dy=-1; dy<=1; dy++) {
                    for(let dx=-1; dx<=1; dx++) {
                        let nx = target.x + dx, ny = target.y + dy;
                        if(nx>=0 && nx<8 && ny>=0 && ny<8) {
                            affectedIndices.push(ny * 8 + nx);
                            spawnProjectile({x:nx, y:-1}, {x:nx, y:ny}, 'Arrow');
                        }
                    }
                }
                await new Promise(r => setTimeout(r, 400));
                if(!target.dead) applyDmg(target, totalAtk);
            }
            affectedIndices.forEach(idx => {
                grid[idx] = active.element;
                const tile = document.querySelectorAll('.tile')[idx];
                tile.className = `tile bg-${active.element}`;
                tile.innerHTML = amulets[idx] ? `<img src="${SPRITES.Muiraquita}" class="amulet-img">` : '';
            });
        }

        const gridEl = document.getElementById('grid');
        usedPath.forEach(idx => {
            if(!isBravely || (active.class === "Tupa" && idx % 8 !== active.x) || (active.class === "Sume" && Math.floor(idx/8) !== active.y) || active.class === "Caipora") {
                 gridEl.replaceChild(createTile(idx), gridEl.childNodes[idx]);
            }
        });

        path = []; renderPath();
        if(gameActive) {
            if(mode === "BOSS") {
                let next = currentPlayerIdx + 1; while(next < players.length && players[next].dead) next++;
                if(next < players.length) { currentPlayerIdx = next; switchConfig(next); }
                else { currentPlayerIdx = -1; document.getElementById('turnP_Active').classList.remove('active-turn'); setTimeout(bossAI, 600); }
            } else { currentPlayerIdx = (currentPlayerIdx === 0) ? 1 : 0; switchConfig(currentPlayerIdx); }
        }
    }

    function triggerElementalFX(element, pos, type, heroX, heroY) {
        const s = getStep();
        const board = document.getElementById('board');
        
        // SONORIZAÇÃO BRAVELY
        if(element === 'FOGO') playSfx('skill1');
        else if(element === 'AGUA') playSfx('iara2');
        else if(element === 'TERRA') playSfx('minoa2');
        else if(element === 'AR') playSfx('saci1');

        if(element === 'FOGO') {
            const f = document.createElement('div');
            f.className = (type === 'COL') ? 'fire-column' : 'fire-row';
            if(type === 'COL') f.style.left = (pos * s + 8) + 'px';
            else f.style.top = (pos * s + 8) + 'px';
            board.appendChild(f);
            setTimeout(() => f.remove(), 1200);
        } else if(element === 'AGUA') {
            const w = document.createElement('div');
            w.className = 'water-jet-fx';
            w.style.opacity = '1';
            if(type === 'COL') { w.style.width = s + 'px'; w.style.height = '100%'; w.style.top = '0'; w.style.left = (pos * s + 8) + 'px'; w.style.background = 'linear-gradient(0deg, transparent, #fff, #3498db, #fff, transparent)'; }
            else { w.style.width = '100%'; w.style.height = s + 'px'; w.style.left = '0'; w.style.top = (pos * s + 8) + 'px'; }
            board.appendChild(w);
            setTimeout(() => w.remove(), 800);
        } else if(element === 'TERRA') {
            // ROCHA PERCORRENDO CAMINHO DO HERÓI PARA OS CANTOS
            for(let i=0; i<8; i++) {
                const tx = (type === 'COL') ? pos : i;
                const ty = (type === 'COL') ? i : pos;
                const dist = Math.abs(tx - heroX) + Math.abs(ty - heroY);
                
                setTimeout(() => {
                    const r = document.createElement('img'); r.src = SPRITES.RockFX; r.className = 'rock-projectile';
                    r.style.width = (s*1.2)+'px';
                    r.style.left = (tx*s+8)+'px'; r.style.top = (ty*s+8)+'px';
                    board.appendChild(r);
                    setTimeout(() => { 
                        r.style.transform = 'scale(2) rotate(1080deg)'; // GIRA MAIS RÁPIDO (3 voltas)
                        r.style.opacity = '0'; 
                    }, 50);
                    setTimeout(() => r.remove(), 450);
                }, dist * 80); // VELOCIDADE DA ONDA
            }
        } else if(element === 'AR') {
            for(let i=0; i<8; i++) {
                const tx = (type === 'COL') ? pos : i;
                const ty = (type === 'COL') ? i : pos;
                const dist = Math.abs(tx - heroX) + Math.abs(ty - heroY);
                triggerVortex(tx, ty, dist * 80);
            }
        }
    }

    function showEndGame(msg, isWin) { gameActive = false; sfx.bgm.pause(); const o = document.getElementById('gameOverlay'); o.style.display = 'flex'; document.getElementById('overlayTitle').innerText = msg; document.getElementById('overlayTitle').className = isWin ? "win-text" : "lose-text"; playSfx(isWin ? 'win' : 'gameover'); }
    function applyDmg(t, amt) {
        if(t.dead) return; t.hp -= amt; showDmgEffect(t.x, t.y, amt);
        if(t.hp <= 0) { t.hp = 0; t.dead = true; if(mode === "BOSS") { if(t === boss) showEndGame("VITÓRIA!", true); else if(players.every(p => p.dead)) showEndGame("GAME OVER", false); } else showEndGame(`VITÓRIA DO ${players.find(p => !p.dead).name}`, true); if(t.id !== undefined) document.getElementById(`tokenP${t.id}`).style.display = 'none'; }
        updateVisuals();
    }

    async function bossAI() {
        if(!gameActive) return; document.getElementById('turnBoss').classList.add('active-turn');
        const bossAtk = parseInt(document.getElementById('atk_BOSS_cfg').value);
        for(let i=0; i<4; i++) {
            let mvs = [{x:boss.x+1,y:boss.y},{x:boss.x-1,y:boss.y},{x:boss.x,y:boss.y+1},{x:boss.x,y:boss.y-1}].filter(m => m.x>=0 && m.x<8 && m.y>=0 && m.y<8 && !isOccupied(m.x, m.y, -1));
            if(mvs.length > 0) { let m = mvs[Math.floor(Math.random()*mvs.length)]; boss.x = m.x; boss.y = m.y; updateVisuals(); await new Promise(r => setTimeout(r, 200)); }
        }
        if(boss.type === "BOITATA") {
            if(Math.random() < 0.6) { addLog("COLUNA DE FOGO!"); playSfx('skill1'); const cs = [boss.x-1, boss.x, boss.x+1]; cs.forEach(c => { if(c>=0 && c<=7) triggerFireColumn(c); }); await new Promise(r => setTimeout(r, 600)); players.forEach(p => { if(!p.dead && cs.includes(p.x)) applyDmg(p, bossAtk); }); }
            else { addLog("LABAREDAS!"); playSfx('skill1'); let c=0, a=0; while(c<5 && a<50) { let i = Math.floor(Math.random()*64); if(grid[i] === 'FOGO') { triggerFlare(i%8, Math.floor(i/8)); players.forEach(p => { if(!p.dead && p.x === i%8 && p.y === Math.floor(i/8)) applyDmg(p, bossAtk); }); c++; } a++; } }
        } else if(boss.type === "MAPINGUARI") {
            if(Math.random() < 0.5) { addLog("MORDIDA GIGANTE!"); playSfx('minoa1'); triggerBite(boss.x, boss.y); await new Promise(r => setTimeout(r, 600)); players.forEach(p => { if(!p.dead && Math.abs(p.x-boss.x)<=2 && Math.abs(p.y-boss.y)<=2) applyDmg(p, bossAtk); }); }
            else { addLog("LANÇAMENTO DE ROCHAS!"); playSfx('minoa2'); triggerRocks(boss.x, boss.y); await new Promise(r => setTimeout(r, 600)); const rs = [boss.y-1, boss.y, boss.y+1]; players.forEach(p => { if(!p.dead && rs.includes(p.y)) applyDmg(p, bossAtk); }); }
        } else if(boss.type === "SACI") {
            if(Math.random() < 0.5) { addLog("REDEMOINHO!"); playSfx('saci1'); grid.forEach((c, i) => { if(c === 'AR') { triggerVortex(i%8, Math.floor(i/8)); players.forEach(p => { if(!p.dead && p.x === i%8 && p.y === Math.floor(i/8)) applyDmg(p, bossAtk); }); } }); }
            else { addLog("TUFÃO DIAGONAL!"); playSfx('saci'); [{dx:1,dy:1},{dx:1,dy:-1},{dx:-1,dy:1},{dx:-1,dy:-1}].forEach(d => { for(let s=1; s<8; s++) { let nx=boss.x+d.dx*s, ny=boss.y+d.dy*s; if(nx>=0 && nx<8 && ny>=0 && ny<8) { triggerVortex(nx, ny, s*100); players.forEach(p => { if(!p.dead && p.x===nx && p.y===ny) setTimeout(()=>applyDmg(p, bossAtk), s*100); }); } } }); }
        } else if(boss.type === "IARA") {
            if(Math.random() < 0.5) { addLog("POROROCA!"); playSfx('iara1'); triggerTsunami(); await new Promise(r => setTimeout(r, 500)); players.forEach(p => { if(!p.dead) { applyDmg(p, 1); let dx = p.x < 4 ? -1 : 1, dy = p.y < 4 ? -1 : 1, nx = p.x, ny = p.y; if(Math.abs(p.x-3.5) > Math.abs(p.y-3.5)) { if(p.x+dx>=0 && p.x+dx<8) nx += dx; } else { if(p.y+dy>=0 && p.y+dy<8) ny += dy; } if (!isOccupied(nx, ny, p.id)) { p.x = nx; p.y = ny; } } }); updateVisuals(); }
            else { addLog("JATO DE ÁGUA!"); playSfx('iara2'); triggerWaterJet(boss.x, boss.y); await new Promise(r => setTimeout(r, 600)); players.forEach(p => { if(!p.dead && (p.x === boss.x || p.y === boss.y)) applyDmg(p, bossAtk); }); }
        }
        await new Promise(r => setTimeout(r, 600)); document.getElementById('turnBoss').classList.remove('active-turn');
        currentPlayerIdx = 0; while(players[currentPlayerIdx] && players[currentPlayerIdx].dead) currentPlayerIdx++; if(players[currentPlayerIdx]) switchConfig(currentPlayerIdx);
    }

    function triggerFireColumn(c) { const f = document.createElement('div'); f.className = 'fire-column'; f.style.left = (c * getStep() + 8) + 'px'; document.getElementById('board').appendChild(f); setTimeout(() => f.remove(), 1200); }
    function triggerFlare(x, y) { const f = document.createElement('div'); f.className = 'flare-fx'; const s = getStep(); f.style.left = (x*s+8)+'px'; f.style.top = (y*s+8)+'px'; document.getElementById('board').appendChild(f); setTimeout(() => f.remove(), 600); }
    function triggerBite(x, y) { const b = document.createElement('img'); b.src = SPRITES.BiteFX; b.className = 'bite-fx'; const s = getStep(); b.style.width = (s*4)+'px'; b.style.height = (s*4)+'px'; b.style.left = (x*s-s*1.5+8)+'px'; b.style.top = (y*s-s*1.5+8)+'px'; b.style.animation = 'biteAnim 0.7s forwards'; document.getElementById('board').appendChild(b); setTimeout(() => b.remove(), 700); }
    function triggerRocks(x, y) { const s = getStep(); ['L', 'R'].forEach(d => { const r = document.createElement('img'); r.src = SPRITES.RockFX; r.className = 'rock-projectile'; r.style.width = (s*2.5)+'px'; r.style.left = (x*s-s*0.5)+'px'; r.style.top = (y*s-s*0.5)+'px'; document.getElementById('board').appendChild(r); setTimeout(() => { r.style.left = (d === 'L' ? -400 : 800) + 'px'; r.style.transform = 'rotate(720deg)'; r.style.opacity = '0'; }, 50); setTimeout(() => r.remove(), 1000); }); }
    function triggerTsunami() { const t = document.createElement('div'); t.className = 'tsunami-fx'; document.getElementById('board').appendChild(t); setTimeout(() => t.remove(), 1200); }
    function triggerWaterJet(bx, by) { const s = getStep(); const h = document.createElement('div'); h.className = 'water-jet-fx'; h.style.width = '100%'; h.style.height = s + 'px'; h.style.left = '0'; h.style.top = (by * s + 8) + 'px'; document.getElementById('board').appendChild(h); const v = document.createElement('div'); v.className = 'water-jet-fx'; v.style.width = s + 'px'; v.style.height = '100%'; v.style.top = '0'; v.style.left = (bx * s + 8) + 'px'; v.style.background = 'linear-gradient(0deg, transparent, #fff, #3498db, #fff, transparent)'; document.getElementById('board').appendChild(v); setTimeout(() => { h.remove(); v.remove(); }, 600); }
    function triggerVortex(x, y, d = 0) { setTimeout(() => { const v = document.createElement('img'); v.src = SPRITES.VortexFX; v.className = 'vortex-fx'; const s = getStep(); v.style.width = s + 'px'; v.style.height = s + 'px'; v.style.left = (x * s + 8) + 'px'; v.style.top = (y * s + 8) + 'px'; document.getElementById('board').appendChild(v); setTimeout(() => { v.style.opacity = '0'; v.style.transform = 'scale(0.5)'; }, 500); setTimeout(() => v.remove(), 800); }, d); }

    function getStep() { return parseInt(getComputedStyle(document.documentElement).getPropertyValue('--step')); }
    function updateVisuals() { const s = getStep(); players.forEach(p => { const t = document.getElementById(`tokenP${p.id}`); if(t && !p.dead) { t.style.left = (p.x*s+8)+'px'; t.style.top = (p.y*s+8)+'px'; const h = document.getElementById(`hpBarP${p.id}`); if(h) h.style.width = (p.hp/p.maxHp)*100+'%'; } }); if(mode === "BOSS") { const bt = document.getElementById('tokenBoss'); if(bt) { bt.style.left = (boss.x*s+8)+'px'; bt.style.top = (boss.y*s+8)+'px'; const bh = document.getElementById('hpBarBoss'); if(bh) bh.style.width = (boss.hp/boss.maxHp)*100+'%'; } document.getElementById('bossStatsDisplay').innerHTML = `${boss.type}: <b>${boss.hp}</b> / ${boss.maxHp}`; } }
    function activateSkill() { if (!gameActive || players[currentPlayerIdx].skillUsed) return; skillActive = true; document.querySelectorAll('.tile').forEach(t => t.classList.add('skill-mode')); }
    function showDmgEffect(x,y,a){ const s=getStep(), f=document.createElement('div'); f.className='dmg-float'; f.innerText=`-${a}`; f.style.left=(x*s+20)+'px'; f.style.top=(y*s)+'px'; document.getElementById('board').appendChild(f); setTimeout(()=>f.remove(), 1200); }
    function showHealEffect(x,y,a){ const s=getStep(), f=document.createElement('div'); f.className='heal-float'; f.innerText=`+${a}`; f.style.left=(x*s+20)+'px'; f.style.top=(y*s)+'px'; document.getElementById('board').appendChild(f); setTimeout(()=>f.remove(), 1200); }
    function spawnSwordEffect(x,y){ const s=getStep(), i=document.createElement('img'); i.src=SPRITES.SwordFX; i.className='sword-fx'; i.style.left=(x*s+12)+'px'; i.style.top=(y*s+12)+'px'; document.getElementById('board').appendChild(i); setTimeout(()=>i.remove(), 400); }
    async function spawnProjectile(f,t,type){ const s=getStep(), p=document.createElement('img'); p.src=SPRITES[type+'FX']; p.className='projectile'; p.style.left=(f.x*s+20)+'px'; p.style.top=(f.y*s+20)+'px'; document.getElementById('board').appendChild(p); await new Promise(r=>setTimeout(r,50)); p.style.left=(t.x*s+20)+'px'; p.style.top=(t.y*s+20)+'px'; await new Promise(r=>setTimeout(r,300)); p.remove(); }
    
    window.onload = initGame;
</script>
</body>
